<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111c1a"><title>Emberfall — Pocket RPG</title><meta name="description" content="Explore a woodland realm, train gathering skills, forge your sword and defeat the Hollow King. A touch-friendly solo RPG."><link rel="stylesheet" href="style.css"></head><body>
<main id="game"><header><div><span class="eyebrow">THE BORDER REALMS</span><h1>Emberfall<span>◆</span></h1></div><button id="journal" class="icon" aria-label="Open help">?</button></header>
<section class="stats"><div><span id="rank">Adventurer · Combat 1</span><div class="health"><i id="hpbar"></i><b id="hp">30 / 30</b></div></div><div class="gold">◉ <strong id="gold">0</strong><small>COINS</small></div></section>
<section id="viewport"><canvas id="world" aria-label="Game world. Tap the ground to move or tap a resource, monster, or villager to interact."></canvas><div class="region" id="region">Briarhaven</div><button id="mapBtn" class="mapbtn">Map</button><div id="toast" role="status"></div><div class="legend">Tap to walk · Tap objects to interact</div></section>
<section class="action"><div class="actiontext"><strong id="targetTitle">Your adventure begins</strong><span id="targetSub">Talk to Elder Rowan by the campfire.</span></div><button id="eat">Eat <span id="food">0</span></button><button id="stop" aria-label="Stop current action">Stop</button><div id="activity"></div></section>
<nav aria-label="Game panels"><button data-tab="quests" class="selected">📜 Quests</button><button data-tab="bag">🎒 Bag</button><button data-tab="skills">✨ Skills</button></nav><section id="panel"></section><footer><span id="saveStatus">Progress saves on this device</span><span>SOLO ADVENTURE</span></footer>
</main><dialog id="modal"><div id="modalBody"></div><button id="closeModal">Back to adventure</button></dialog><script src="game.js"></script></body></html>
