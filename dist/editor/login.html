<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veldren Editor — Sign in</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10151b;color:#edf2f6;font:16px system-ui}main{width:min(360px,85vw);padding:32px;border:1px solid #394550;border-radius:12px;background:#19212a}h1{font-size:24px}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:6px;border:1px solid #526472}input{background:#0d141b;color:white}button{margin-top:22px;background:#a2d3c2;color:#0c221d;cursor:pointer}a{color:#a2d3c2}#error{color:#ffb5ab;min-height:24px}</style></head>
<body><main><h1>Veldren World Editor</h1><p>Sign in with your mxpsrs owner account.</p><form id="editorLogin"><label for="username">Username</label><input id="username" name="username" autocomplete="username" value="mxpsrs" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Open editor</button><p id="error" role="alert"></p></form><a href="/play">Back to the game</a></main><script src="/editor/login.js"></script></body></html>
