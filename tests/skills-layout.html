<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Crafting layout preview</title>
<style>body{margin:16px;background:#17221f;color:#eee;font:16px system-ui}button{padding:9px 12px;margin:0 6px 10px 0}iframe{display:block;border:1px solid #ab9d77;width:844px;height:390px}</style>
<button id="wide">1112 × 512</button><button id="compact">844 × 390</button>
<iframe title="Veldren crafting preview" src="/__build__/?skillsQA=smith"></iframe>
<script>const frame=document.querySelector('iframe');for(const [id,w,h]of [['wide',1112,512],['compact',844,390]])document.getElementById(id).onclick=()=>{frame.style.width=w+'px';frame.style.height=h+'px'};</script></html>
