name: Veldren final source snapshot
on:
  push:
    branches: [migration/vervesis-native-assets-2026-09-19]
    paths: [.github/workflows/veldren-final-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'mxpsrs/emberfall-game' && github.ref == 'refs/heads/migration/vervesis-native-assets-2026-09-19'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create verified source snapshot in transport-sized parts
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 439dfaaea6e144ab9f2e8ab30304f9c34c1915b2 HEAD
          mkdir -p .qa/recovery
          git bundle create .qa/recovery/veldren.bundle HEAD
          git bundle verify .qa/recovery/veldren.bundle
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          folder=pathlib.Path('.qa/recovery');source=folder/'veldren.bundle';digest=hashlib.sha256();parts=[]
          with source.open('rb') as stream:
              while data:=stream.read(384*1024*1024):
                  name='part-'+str(len(parts)).zfill(2);(folder/name).write_bytes(data);digest.update(data);parts.append({'path':name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          assert len(parts)<=3,'Increase artifact partition count explicitly'
          (folder/'manifest.json').write_text(json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'bundleSha256':digest.hexdigest(),'parts':parts},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veldren-source-part-00
          path: |
            .qa/recovery/part-00
            .qa/recovery/manifest.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: hashFiles('.qa/recovery/part-01') != ''
        with:
          name: veldren-source-part-01
          path: |
            .qa/recovery/part-01
            .qa/recovery/manifest.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: hashFiles('.qa/recovery/part-02') != ''
        with:
          name: veldren-source-part-02
          path: |
            .qa/recovery/part-02
            .qa/recovery/manifest.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
